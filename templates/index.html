<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NLP - Emotion Detection</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <style>
        body { background: #f5f7fb; }
        .center-heading { text-align: center; }
        .card { max-width: 760px; margin: 40px auto; }
        #system_response { min-height: 64px; padding: 12px 14px; border-radius: 6px; background: #eef5ff; }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-body">
            <h1 class="center-heading">NLP - Emotion Detection</h1>
            <div style="padding: 25px 25px 25px 25px;">
                <h2 class="mb-3">
                    <label class="form-label" for="textToAnalyze">Please enter the text to be analyzed</label>
                    <input type="text" class="form-control" id="textToAnalyze" placeholder="I feel very excited and happy today!">
                </h2>

                <div style="padding: 25px 25px 25px 25px;">
                    <button onclick="RunSentimentAnalysis()" class="btn btn-secondary" type="button">Run Sentiment Analysis</button>
                </div>

                <h2 class="mb-3">
                    <label class="form-label">Result of Emotion Detection</label>
                </h2>

                <div id="system_response" style="padding: 25px 25px 25px 25px;">Result will appear here.</div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</body>
</html>
